<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-labelledby="fmguard-title fmguard-desc" style="font-family:var(--sans)"><title id="fmguard-title" data-en="Harness subagent vs crewmate" data-hant="harness 的 subagent vs crewmate" data-hans="harness 的 subagent vs crewmate">Harness subagent vs crewmate</title><desc id="fmguard-desc" data-en="Two panels: the harness's own Agent tool is denied by a PreToolUse guard because such work leaves no fleet record and dies with the session; a crewmate goes through fm-brief and fm-spawn and gets a worktree, a pane, metadata, and a status log the watcher can see." data-hant="兩個面板：harness 自帶的 Agent 工具被 PreToolUse guard 擋下，因為那種工作沒有 fleet 紀錄、session 一死就沒了；crewmate 走 fm-brief 和 fm-spawn，拿到 worktree、pane、metadata 和 watcher 看得到的 status log。" data-hans="两个面板：harness 自带的 Agent 工具被 PreToolUse guard 挡下，因为那种工作没有 fleet 纪录、session 一死就没了；crewmate 走 fm-brief 和 fm-spawn，拿到 worktree、pane、metadata 和 watcher 看得到的 status log。">Two panels: the harness's own Agent tool is denied by a PreToolUse guard because such work leaves no fleet record and dies with the session; a crewmate goes through fm-brief and fm-spawn and gets a worktree, a pane, metadata, and a status log the watcher can see.</desc><defs><marker id="fmguard-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker><marker id="fmguard-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker><marker id="fmguard-arrow-fg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--fg)"/></marker><marker id="fmguard-arrow-seal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--seal)"/></marker><marker id="fmguard-arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--amber)"/></marker><marker id="fmguard-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="var(--muted)" stroke-width="1.2"/></marker></defs><rect x="32" y="32" width="424" height="296" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/><rect x="504" y="32" width="424" height="296" rx="6" fill="none" stroke="var(--rule)" stroke-width="1"/><text x="48" y="56" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="start" style="font-family:var(--mono)" data-en="LEFT: the Agent tool (denied)" data-hant="左：Agent 工具（被擋）" data-hans="左：Agent 工具（被挡）">LEFT: the Agent tool (denied)</text><text x="520" y="56" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="start" style="font-family:var(--mono)" data-en="RIGHT: the fleet path" data-hant="右：fleet 的路" data-hans="右：fleet 的路">RIGHT: the fleet path</text><path d="M 166,126 V 150" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#fmguard-arrow)" data-edge="lp-tool"/><path d="M 166,206 V 230" fill="none" stroke="var(--seal)" stroke-width="1.2" marker-end="url(#fmguard-arrow-seal)" data-edge="lt-guard"/><rect x="86" y="72" width="160" height="48" rx="6" fill="var(--card)"/><rect x="86" y="72" width="160" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1" data-node="primary-l"/><text x="166" y="100" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Primary session" data-hant="primary session" data-hans="primary session">Primary session</text><rect x="86" y="152" width="160" height="48" rx="6" fill="var(--card)"/><rect x="86" y="152" width="160" height="48" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="1" data-node="agent-tool"/><text x="166" y="180" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Agent / Task tool" data-hant="Agent / Task 工具" data-hans="Agent / Task 工具">Agent / Task tool</text><rect x="66" y="232" width="200" height="48" rx="6" fill="var(--card)"/><rect x="66" y="232" width="200" height="48" rx="6" fill="var(--card)" stroke="var(--seal)" stroke-width="1" data-node="guard"/><text x="166" y="252" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="PreToolUse guard: deny" data-hant="PreToolUse guard：拒絕" data-hans="PreToolUse guard：拒绝">PreToolUse guard: deny</text><text x="166" y="272" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="fm-subagent-pretool-check.sh" data-hant="fm-subagent-pretool-check.sh" data-hans="fm-subagent-pretool-check.sh">fm-subagent-pretool-check.sh</text><rect x="286" y="152" width="160" height="128" rx="6" fill="var(--card)"/><rect x="286" y="152" width="160" height="128" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" data-node="consequence"/><text x="366" y="176" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="if it had run:" data-hant="如果沒擋住：" data-hans="如果没挡住：">if it had run:</text><text x="366" y="200" font-size="12" font-weight="400" fill="var(--fg)" text-anchor="middle" style="font-family:var(--mono)" data-en="no state/&lt;id&gt;.meta" data-hant="沒有 state/&lt;id&gt;.meta" data-hans="没有 state/&lt;id&gt;.meta">no state/&lt;id&gt;.meta</text><text x="366" y="220" font-size="12" font-weight="400" fill="var(--fg)" text-anchor="middle" style="font-family:var(--mono)" data-en="no brief, no worktree" data-hant="沒 brief、沒 worktree" data-hans="没 brief、没 worktree">no brief, no worktree</text><text x="366" y="240" font-size="12" font-weight="400" fill="var(--fg)" text-anchor="middle" style="font-family:var(--mono)" data-en="watcher sees nothing" data-hant="watcher 看不到" data-hans="watcher 看不到">watcher sees nothing</text><text x="366" y="260" font-size="12" font-weight="400" fill="var(--seal)" text-anchor="middle" style="font-family:var(--mono)" data-en="dies with the session" data-hant="session 一死就沒了" data-hans="session 一死就没了">dies with the session</text><path d="M 638,126 V 150" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#fmguard-arrow)" data-edge="rp-brief"/><path d="M 638,206 V 230" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#fmguard-arrow)" data-edge="rb-spawn"/><path d="M 720,256 H 748" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#fmguard-arrow)" data-edge="rs-crew"/><rect x="558" y="72" width="160" height="48" rx="6" fill="var(--card)"/><rect x="558" y="72" width="160" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1" data-node="primary-r"/><text x="638" y="100" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Primary session" data-hant="primary session" data-hans="primary session">Primary session</text><rect x="558" y="152" width="160" height="48" rx="6" fill="var(--card)"/><rect x="558" y="152" width="160" height="48" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="1" data-node="brief"/><text x="638" y="172" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="bin/fm-brief.sh" data-hant="bin/fm-brief.sh" data-hans="bin/fm-brief.sh">bin/fm-brief.sh</text><text x="638" y="192" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="brief.md scaffold" data-hant="brief.md 骨架" data-hans="brief.md 骨架">brief.md scaffold</text><rect x="558" y="232" width="160" height="48" rx="6" fill="var(--card)"/><rect x="558" y="232" width="160" height="48" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="1" data-node="spawn"/><text x="638" y="252" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="bin/fm-spawn.sh" data-hant="bin/fm-spawn.sh" data-hans="bin/fm-spawn.sh">bin/fm-spawn.sh</text><text x="638" y="272" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="meta · backlog · pane" data-hant="meta · backlog · pane" data-hans="meta · backlog · pane">meta · backlog · pane</text><rect x="750" y="216" width="160" height="80" rx="6" fill="var(--card)"/><rect x="750" y="216" width="160" height="80" rx="6" fill="var(--card-2)" stroke="var(--muted)" stroke-width="1" data-node="crew"/><text x="830" y="252" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Crewmate" data-hant="crewmate" data-hans="crewmate">Crewmate</text><text x="830" y="272" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="worktree · status log" data-hant="worktree · status log" data-hans="worktree · status log">worktree · status log</text><line x1="32" y1="352" x2="928" y2="352" stroke="var(--rule)" stroke-width="0.8"/><text x="32" y="368" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="start" style="font-family:var(--mono)" data-en="LEGEND" data-hant="圖例" data-hans="图例">LEGEND</text><rect x="112" y="358" width="20" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/><text x="140" y="368" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="start" style="font-family:var(--sans)" data-en="primary session" data-hant="primary session" data-hans="primary session">primary session</text><rect x="268" y="358" width="20" height="12" rx="2" fill="var(--card)" stroke="var(--seal)" stroke-width="1"/><text x="296" y="368" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="start" style="font-family:var(--sans)" data-en="refused" data-hant="被拒絕" data-hans="被拒绝">refused</text><rect x="368" y="358" width="20" height="12" rx="2" fill="var(--card-2)" stroke="var(--muted)" stroke-width="1"/><text x="396" y="368" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="start" style="font-family:var(--sans)" data-en="durable fleet record" data-hant="durable fleet 紀錄" data-hans="durable fleet 纪录">durable fleet record</text></svg>