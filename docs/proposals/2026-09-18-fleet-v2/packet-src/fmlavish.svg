lavish-axi poll (blocking, detached from the turn)</text><path d="M 650,296 H 478" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#fmlavish-arrow)" data-edge="captain-lavish"/><rect x="446" y="272" width="240" height="16" rx="2" fill="var(--card)"/><text x="566" y="284" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="answer cards, Send / Send &amp; End" data-hant="在卡片上作答，Send / Send &amp; End" data-hans="在卡片上作答，Send / Send &amp; End">answer cards, Send / Send &amp; End</text><path d="M 470,336 H 302" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fmlavish-arrow)" data-edge="lavish-runner"/><rect x="214" y="312" width="348" height="16" rx="2" fill="var(--card)"/><text x="388" y="324" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="poll returns feedback (server clears it first)" data-hant="poll 回傳 feedback（server 先清掉）" data-hans="poll 回传 feedback（server 先清掉）">poll returns feedback (server clears it first)</text><path d="M 300,364 H 340 Q 348,364 348,372 V 380 Q 348,388 340,388 H 306" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#fmlavish-arrow-accent)" data-edge="runner-runner"/><rect x="356" y="368" width="356" height="16" rx="2" fill="var(--card)"/><text x="364" y="380" font-size="12" font-weight="400" fill="var(--accent)" text-anchor="start" style="font-family:var(--mono)" data-en="capture state/procevent-inbox/&lt;id&gt;.&lt;seq&gt;.result" data-hant="捕捉到 state/procevent-inbox/&lt;id&gt;.&lt;seq&gt;.result" data-hans="捕捉到 state/procevent-inbox/&lt;id&gt;.&lt;seq&gt;.result">capture state/procevent-inbox/&lt;id&gt;.&lt;seq&gt;.result</text><path d="M 306,416 H 834" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#fmlavish-arrow-accent)" data-edge="runner-hold"/><rect x="382" y="392" width="372" height="16" rx="2" fill="v