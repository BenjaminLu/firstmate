<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 696" width="100%" role="img" aria-labelledby="fmlavish-title fmlavish-desc" style="font-family:var(--sans)"><title id="fmlavish-title" data-en="A Lavish answer travels back without a blocked turn" data-hant="Lavish 的回答回到 firstmate，過程不卡任何回合" data-hans="Lavish 的回答回到 firstmate，过程不卡任何回合">A Lavish answer travels back without a blocked turn</title><desc id="fmlavish-desc" data-en="Sequence showing the board served and proved live, the answer source bound before it is armed, a detached runner blocking on lavish-axi poll, the captain answering, the result captured and announced as a wake, choice answers fed to the captain-hold intake, and the first mate reading and acknowledging." data-hant="Sequence：看板先提供並證明 live、答案來源先 bind 再 arm、runner 在背景阻塞於 lavish-axi poll、captain 作答、結果被捕捉並發出喚醒、選項答案餵給 captain-hold intake、firstmate 讀取並 ack。" data-hans="Sequence：看板先提供并证明 live、答案来源先 bind 再 arm、runner 在背景阻塞于 lavish-axi poll、captain 作答、结果被捕捉并发出唤醒、选项答案喂给 captain-hold intake、firstmate 读取并 ack。">Sequence showing the board served and proved live, the answer source bound before it is armed, a detached runner blocking on lavish-axi poll, the captain answering, the result captured and announced as a wake, choice answers fed to the captain-hold intake, and the first mate reading and acknowledging.</desc><defs><marker id="fmlavish-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker><marker id="fmlavish-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker><marker id="fmlavish-arrow-fg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--fg)"/></marker><marker id="fmlavish-arrow-seal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--seal)"/></marker><marker id="fmlavish-arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--amber)"/></marker><marker id="fmlavish-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="var(--muted)" stroke-width="1.2"/></marker></defs><rect x="32" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="32" y="40" width="176" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1" data-node="fm"/><text x="120" y="72" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="First mate" data-hant="firstmate" data-hans="firstmate">First mate</text><rect x="212" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="212" y="40" width="176" height="56" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="1" data-node="runner"/><text x="300" y="64" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Runner" data-hant="runner" data-hans="runner">Runner</text><text x="300" y="84" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="bin/fm-procevent.sh" data-hant="bin/fm-procevent.sh" data-hans="bin/fm-procevent.sh">bin/fm-procevent.sh</text><rect x="388" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="388" y="40" width="176" height="56" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" data-node="lavish"/><text x="476" y="64" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Lavish server" data-hant="Lavish server" data-hans="Lavish server">Lavish server</text><text x="476" y="84" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="lavish-axi" data-hant="lavish-axi" data-hans="lavish-axi">lavish-axi</text><rect x="568" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="568" y="40" width="176" height="56" rx="6" fill="var(--card)" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3" data-node="captain"/><text x="656" y="64" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Captain" data-hant="Captain" data-hans="Captain">Captain</text><text x="656" y="84" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="browser" data-hant="瀏覽器" data-hans="浏览器">browser</text><rect x="748" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="748" y="40" width="176" height="56" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="1" data-node="hold"/><text x="836" y="64" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Keyed-answer intake" data-hant="keyed-answer intake" data-hans="keyed-answer intake">Keyed-answer intake</text><text x="836" y="84" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="bin/fm-captain-hold.sh" data-hant="bin/fm-captain-hold.sh" data-hans="bin/fm-captain-hold.sh">bin/fm-captain-hold.sh</text><line x1="120" y1="96" x2="120" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="300" y1="96" x2="300" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="476" y1="96" x2="476" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="656" y1="96" x2="656" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="836" y1="96" x2="836" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><path d="M 126,136 H 474" fill="none" stroke="var(--muted)" stroke-width="1.2" marker