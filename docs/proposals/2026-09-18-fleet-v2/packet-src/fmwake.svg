m-watch.sh">bin/fm-watch.sh</text><rect x="568" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="568" y="40" width="176" height="56" rx="6" fill="var(--card)" stroke="var(--fg)" stroke-width="1" data-node="hook"/><text x="656" y="64" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="Stop hook" data-hant="Stop hook" data-hans="Stop hook">Stop hook</text><text x="656" y="84" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en="fm-claude-stop-autoarm" data-hant="fm-claude-stop-autoarm" data-hans="fm-claude-stop-autoarm">fm-claude-stop-autoarm</text><rect x="748" y="40" width="176" height="56" rx="6" fill="var(--card)"/><rect x="748" y="40" width="176" height="56" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1" data-node="fm"/><text x="836" y="72" font-size="12" font-weight="600" fill="var(--fg)" text-anchor="middle" style="font-family:var(--sans)" data-en="First mate" data-hant="firstmate" data-hans="firstmate">First mate</text><line x1="120" y1="96" x2="120" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="300" y1="96" x2="300" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="476" y1="96" x2="476" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="656" y1="96" x2="656" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><line x1="836" y1="96" x2="836" y2="616" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3,3"/><path d="M 126,136 H 298" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#fmwake-arrow)" data-edge="pane-status"/><rect x="90" y="112" width="240" height="16" rx="2" fill="var(--card)"/><text x="210" y="124" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle" style="font-family:var(--mono)" data-en=