<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>firstmate: how it talks to crewmates and to Lavish</title>
<style>
:root{
  /* Palette from the diagram-design style guide, so a diagram drawn by that
     skill and the page around it are one surface. Its role names map onto the
     variables the diagrams already reference. */
  --bg:#f5f5f5;        /* paper */
  --card:#ffffff;
  --card-2:#ececec;    /* paper-2 */
  --fg:#2d3142;        /* ink */
  --muted:#4f5d75;     /* blue-slate */
  --soft:#7a8399;
  --rule:rgba(45,49,66,.12);
  --rule-strong:#bfc0c0;   /* silver */
  --accent:#eb6c36;        /* atomic-tangerine — 1–2 focal points per diagram */
  --accent-tint:rgba(235,108,54,.08);
  --link:#2e5aa8;
  --amber:#b8915a;         /* mustard, from the series scale */
  --seal:#9c6b50;          /* rust-brown */
  --ok:#7c8f6f;            /* sage */
  --shadow:0 1px 2px rgba(45,49,66,.06),0 10px 28px rgba(45,49,66,.06);

  /* A display serif, a text sans and a data mono — all from the system, so
     three real typographic roles cost nothing and never fall back silently. */
  --serif:"Songti TC","Songti SC","Noto Serif CJK TC","Source Han Serif TC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Noto Sans CJK TC","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#2d3142;--card:#393e53;--card-2:#333849;--fg:#f5f5f5;--muted:#bfc0c0;
    --soft:#8e98ac;--rule:rgba(245,245,245,.12);--rule-strong:rgba(191,192,192,.25);
    --accent:#f08a59;--accent-tint:rgba(240,138,89,.10);--link:#6a95d8;
    --amber:#d3ad7a;--seal:#b88670;--ok:#9caf8f;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4)}
}
:root[data-theme=dark]{--bg:#2d3142;--card:#393e53;--card-2:#333849;--fg:#f5f5f5;--muted:#bfc0c0;
    --soft:#8e98ac;--rule:rgba(245,245,245,.12);--rule-strong:rgba(191,192,192,.25);
    --accent:#f08a59;--accent-tint:rgba(240,138,89,.10);--link:#6a95d8;
    --amber:#d3ad7a;--seal:#b88670;--ok:#9caf8f;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4)}
:root[data-theme=light]{--bg:#f5f5f5;--card:#ffffff;--card-2:#ececec;--fg:#2d3142;--muted:#4f5d75;
  --soft:#7a8399;--rule:rgba(45,49,66,.12);--rule-strong:#bfc0c0;
  --accent:#eb6c36;--accent-tint:rgba(235,108,54,.08);--link:#2e5aa8;
  --amber:#b8915a;--seal:#9c6b50;--ok:#7c8f6f;
  --shadow:0 1px 2px rgba(45,49,66,.06),0 10px 28px rgba(45,49,66,.06)}

/* One line scales the whole composition, so a 4K screen shows the same
   design larger rather than the same pixels stranded in the middle. */
html{font-size:clamp(16px,0.62vw + 12.4px,21px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:1rem;line-height:1.68;-webkit-font-smoothing:antialiased;
  padding:0 1.25rem 0 4.6rem}
main{max-width:78rem;margin:0 auto}

header.top{padding:3rem 0 1.5rem;border-bottom:2px solid var(--fg);margin-bottom:1.6rem;
  display:flex;justify-content:space-between;align-items:flex-end;gap:1.5rem;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.7rem}
h1{font-family:var(--serif);font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:600;
  line-height:1.24;margin:0 0 .55rem;text-wrap:balance;letter-spacing:-.005em}
.lede{font-size:1.06rem;color:var(--muted);max-width:42rem;margin:0}
.lede strong{color:var(--fg);font-weight:600}
.langs{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;flex:none}
.langs button{border:0;background:transparent;color:var(--muted);cursor:pointer;
  padding:.34rem .68rem;font:inherit;font-family:var(--mono);font-size:.72rem;
  transition:background .16s,color .16s}
.langs button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.langs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* The palette legend sits under each diagram — it explains the drawing, so it
   lives with the drawing, not in the header two scrolls away. */
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin-top:.8rem;
  font-size:.76rem;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:.44rem}
.swatch{width:.7rem;height:.7rem;border-radius:2px;flex:0 0 auto}
.swatch.subj{background:var(--accent)}
.swatch.att{background:var(--amber)}
.swatch.term{background:var(--seal)}
.swatch.ctx{background:transparent;border:1.5px dashed var(--muted)}

/* The outline is a rail the reader brushes past, not a column that spends a
   fifth of every page on navigation. The ticks are always there — they say
   where you are and how much is left — and the full list slides out over the
   content on approach. The content keeps the whole width, which is what lets
   the figures and the type be read instead of squinted at. */
.stage{display:block}

.rail{position:fixed;left:0;top:0;bottom:0;z-index:40}
.rail-ticks{width:4.6rem;height:100%;display:flex;flex-direction:column;
  justify-content:center;gap:.3rem;padding:0 .8rem 0 .9rem;
  border-right:1px solid var(--rule);background:var(--bg)}
.rail-ticks button{font:inherit;font-family:var(--mono);font-size:.62rem;
  font-variant-numeric:tabular-nums;color:var(--soft);cursor:pointer;
  background:none;border:0;padding:.22rem 0;text-align:left;
  display:flex;align-items:center;gap:.4rem;transition:color .14s}
.rail-ticks button::after{content:"";flex:1;height:1px;background:var(--rule-strong);
  transition:background .14s,height .14s}
.rail-ticks button:hover{color:var(--fg)}
.rail-ticks button:hover::after{background:var(--fg)}
.rail-ticks button[aria-current=true]{color:var(--accent)}
.rail-ticks button[aria-current=true]::after{background:var(--accent);height:2px}
.rail-ticks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Off-canvas, never display:none — a tab into it opens it, so the list is
   reachable without a pointer. */
.outline{position:absolute;left:0;top:0;bottom:0;width:21rem;overflow-y:auto;
  background:var(--card);border-right:1px solid var(--rule);
  /* It floats over the content, so it needs an edge the content does not. */
  box-shadow:var(--shadow),14px 0 34px -12px rgba(0,0,0,.28);
  padding:1.6rem 1.2rem;transform:translateX(-101%);
  transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.rail:hover .outline,.rail:focus-within .outline,
.rail.open .outline{transform:none}

@media (max-width:56rem){
  body{padding-left:1.25rem}
  .rail{position:static}
  .rail-ticks{display:none}
  .outline{position:static;transform:none;width:auto;overflow:visible;
    border:1px solid var(--rule);border-radius:5px;padding:1rem;margin-bottom:1.3rem}
}
.outline h2,.panel h2{font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 .7rem;font-weight:700}
.outline ol{list-style:none;margin:0;padding:0;counter-reset:step}
.outline li{counter-increment:step}
.outline ol button{width:100%;text-align:left;font:inherit;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:4px;
  padding:.44rem .6rem .44rem .5rem;color:var(--fg);line-height:1.4;
  display:flex;gap:.6rem;align-items:baseline;
  transition:background .13s,border-color .13s}
.outline ol button::before{content:counter(step,decimal-leading-zero);
  font-family:var(--mono);font-size:.68rem;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none}
.outline ol button:hover{background:var(--card-2)}
.outline ol button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.outline ol button[aria-current=true]{background:var(--card);border-color:var(--accent);
  box-shadow:var(--shadow)}
.outline ol button[aria-current=true]::before{color:var(--accent)}
.outline .ttl{font-size:.88rem}

.panel{min-width:0}
.step{display:none}
.step.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step.on{animation:rise .3s cubic-bezier(.2,.7,.3,1) both}

.card{background:var(--card);border:1px solid var(--rule);border-radius:5px;
  box-shadow:var(--shadow);padding:1.35rem 1.5rem}
.card h3{font-family:var(--serif);font-size:1.32rem;font-weight:600;line-height:1.3;
  margin:0 0 .35rem;text-wrap:balance}
.card .sub{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:0 0 1rem}
.lede-body{font-size:1.1rem;line-height:1.6;margin:0}
/* A name kept as a name. Translating `status_log` would cost the reader the
   word they need when they go and ask an engineer about it. */
code,.term{font-family:var(--mono);font-size:.875em;background:var(--card-2);
  padding:.08em .34em;border-radius:3px;word-break:break-word}
ul.findings code,ul.findings .term{font-size:.84em}

figure.fig{margin:0}
.figbody{background:var(--card);border:1px solid var(--rule);border-radius:5px;
  box-shadow:var(--shadow);padding:1.2rem;overflow-x:auto;text-align:center}
.figbody svg{max-width:100%;height:auto;display:inline-block}
figcaption{font-size:.85rem;color:var(--muted);margin-top:.75rem;line-height:1.55}

/* Prose that has been thought about. A section body is a sequence of blocks,
   not one grey slab: a sub-head where the argument turns, a measure short
   enough to track, and small figures inline — because a number belongs in a
   tile and a comparison in a bar, not in the third clause of a sentence. */
.prose{display:flex;flex-direction:column;gap:1.05rem}
.prose>h4{font-family:var(--serif);font-size:1.14rem;font-weight:600;
  margin:.5rem 0 -.45rem;line-height:1.34;text-wrap:balance}
.prose>h4:first-child{margin-top:0}
.prose>p{margin:0;font-size:1.05rem;line-height:1.68;max-width:46rem}
.prose>p.lead{font-size:1.2rem;line-height:1.56;max-width:44rem}
.prose .aside{border-left:3px solid var(--amber);background:var(--card-2);
  padding:.8rem 1.05rem;border-radius:3px;font-size:1rem;line-height:1.62;
  max-width:54rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.6rem}
.stat{border:1px solid var(--rule);border-radius:4px;background:var(--card-2);
  padding:.8rem .95rem}
.stat .n{font-family:var(--serif);font-size:1.8rem;line-height:1.08;font-weight:600;
  font-variant-numeric:tabular-nums;display:block}
.stat .k{font-size:.84rem;color:var(--muted);line-height:1.45;display:block;
  margin-top:.35rem}
.stat.accent{border-color:var(--accent)} .stat.accent .n{color:var(--accent)}
.stat.warn{border-color:var(--amber)}   .stat.warn .n{color:var(--amber)}
.stat.seal{border-color:var(--seal)}    .stat.seal .n{color:var(--seal)}
.stat.ok{border-color:var(--ok)}        .stat.ok .n{color:var(--ok)}

.bars{display:flex;flex-direction:column;gap:.5rem}
.bars .b{display:grid;grid-template-columns:minmax(7rem,13rem) 1fr auto;gap:.8rem;
  align-items:center;font-size:.92rem}
.bars .bk{color:var(--muted);line-height:1.4}
.bars .bt{height:.66rem;border-radius:2px;background:var(--card-2);overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--muted);border-radius:2px}
.bars .b.accent .bt i{background:var(--accent)}
.bars .b.warn .bt i{background:var(--amber)}
.bars .b.ok .bt i{background:var(--ok)}
.bars .b.seal .bt i{background:var(--seal)}
.bars .bv{font-family:var(--mono);font-size:.76rem;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* Wider than a paragraph because of the label column, still a measure the
   eye can track back from. Figures may span; text may not. */
.kv{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.1rem;margin:0;
  font-size:.98rem;align-items:baseline;max-width:60rem}
.kv dt{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.kv dd{margin:0;line-height:1.6}

/* A finding is a row with a severity stripe, not a bullet: what needs
   attention has to read before the sentence does. */
ul.findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}
ul.findings li{background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--rule-strong);border-radius:4px;
  padding:.8rem 1rem;font-size:.97rem;box-shadow:var(--shadow);
  opacity:0;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
ul.findings li.risk{border-left-color:var(--seal);background:var(--card)}
ul.findings li.warn{border-left-color:var(--amber)}
ul.findings li.ok{border-left-color:var(--accent)}
ul.findings .tag{display:block;font-family:var(--mono);font-size:.64rem;
  letter-spacing:.11em;text-transform:uppercase;margin-bottom:.28rem;color:var(--muted)}
ul.findings li.risk .tag{color:var(--seal)}
ul.findings li.warn .tag{color:var(--amber)}
ul.findings li.ok .tag{color:var(--accent)}

/* A vulnerability card: what the attack was, drawn, then problem and fix in
   plain rows. The reader should never need the PR's code to grasp either. */
.vuln-sev{display:inline-block;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.1em;text-transform:uppercase;padding:.12rem .5rem;border-radius:3px;
  font-weight:700;margin-bottom:.7rem}
.vuln-sev.p0{background:var(--seal);color:#fff}
.vuln-sev.p1{background:var(--amber);color:#fff}
.vuln-sev.p2{background:var(--rule-strong);color:var(--card)}
.vuln-pf{display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;margin-top:1rem;
  align-items:baseline}
.vuln-pf dt{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;
  text-transform:uppercase;font-weight:700;white-space:nowrap}
.vuln-pf dt.prob{color:var(--seal)} .vuln-pf dt.fix{color:var(--ok)}
.vuln-pf dd{margin:0;font-size:.97rem;line-height:1.55}
.vuln-ref{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:.7rem}
/* Code links stay quiet: the identifier is the link, nothing is added. */
#steps a{color:inherit;text-decoration:underline dotted var(--soft);text-underline-offset:3px}
#steps a:hover{color:var(--link);text-decoration-color:var(--link)}
#steps a code{text-decoration:inherit}

/* Transactions-as-transactions: each state edge is one DB transaction. An
   envelope groups the writes that commit together; anything outside it is
   marked, because "also a write" is the trap the reference page is built to
   expose. */
.txn{border:2px solid var(--accent);border-radius:5px;overflow:hidden;margin:0 0 1rem;
  background:var(--card);box-shadow:var(--shadow)}
.txn>.cap{background:var(--accent);color:#fff;padding:.5rem .9rem;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;font-weight:700;
  display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.txn>.cap .method{opacity:.9;font-weight:500}
.txn .rows{padding:.5rem .9rem .9rem}
.txn .foot{padding:.6rem .9rem;border-top:1px dashed var(--rule);background:var(--card-2);
  font-size:.85rem;color:var(--muted)}
.rowblock{margin-top:.85rem}
.rowblock .rhead{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;margin-bottom:.3rem}
.rowblock .tbl{font-family:var(--mono);font-size:.82rem;font-weight:700}
.op{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;padding:.05rem .38rem;
  border-radius:3px;border:1px solid var(--rule);color:var(--muted);text-transform:uppercase}
.op.ins{border-color:var(--accent);color:var(--accent)}
.op.upd{border-color:var(--amber);color:var(--amber)}
.rowblock .guard{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
table.fields{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.25rem}
table.fields td{padding:.3rem .5rem;border-bottom:1px solid var(--rule);vertical-align:top}
table.fields tr:last-child td{border-bottom:none}
table.fields .k{font-family:var(--mono);font-size:.78rem;white-space:nowrap;width:1%;color:var(--muted)}
table.fields .v{font-family:var(--mono);font-size:.78rem;word-break:break-word}
table.fields .was{color:var(--muted);text-decoration:line-through;margin-right:.4rem}
table.fields .now{color:var(--fg);font-weight:600}
table.fields .now.ver{color:var(--amber)} table.fields .now.term{color:var(--seal)}
.outside{border:1.5px dashed var(--muted);border-radius:5px;padding:.7rem .9rem;margin-top:.75rem}
.outside .ocap{font-family:var(--mono);font-size:.62rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.4rem}
.outside ul{margin:0;padding-left:1.1em;font-size:.86rem} .outside li{margin:.3rem 0}
.takeaway{border-left:3px solid var(--seal);background:var(--card-2);padding:.7rem .95rem;
  border-radius:3px;margin-top:.85rem;font-size:.92rem}

/* Arrows draw in so the eye follows the system's order instead of landing on
   a finished tangle. */
.figbody svg path[data-edge]{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:draw .68s cubic-bezier(.3,.8,.4,1) forwards}
.figbody svg rect[data-node]{opacity:0;animation:pop .34s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Interactive state map: click a state, see the DB transaction that produced
   it, and which rollout stage it sits in. */
.smap .figbody svg [data-node]{cursor:pointer;transition:opacity .15s}
.smap .figbody svg [data-node]:hover{opacity:.72}
.smap .figbody svg [data-node].picked{outline:none}
/* A shape with nothing behind it must not invite a click it cannot answer. */
.smap .figbody svg [data-node].inert{cursor:default}
.smap .figbody svg [data-node].inert:hover{opacity:1}
.smap-stages{display:flex;gap:.4rem;margin:.9rem 0;flex-wrap:wrap}
.smap-stage{flex:1;min-width:7rem;text-align:center;font-family:var(--mono);
  cursor:pointer;
  font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--rule);border-radius:5px;padding:.5rem .3rem;transition:all .2s}
.smap-stage:hover:not(.empty){border-color:var(--accent);color:var(--accent)}
.smap-stage.on{border-color:var(--accent);color:var(--accent);background:var(--card-2);font-weight:700}
.smap-stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* A stage no state belongs to is shown, but plainly not a control. */
.smap-stage.empty{cursor:default;opacity:.45}
.smap-hint{color:var(--muted);font-size:.82rem;margin:.2rem 0 0}
.smap-detail{margin-top:1rem;min-height:2rem}
.smap-detail:empty::before{content:attr(data-empty);color:var(--muted);font-size:.9rem}

.nav{display:flex;gap:.5rem;margin-top:1.1rem;align-items:center}
button.act{font:inherit;font-size:.86rem;padding:.44rem .95rem;border-radius:4px;
  border:1px solid var(--rule);background:var(--card);color:var(--fg);cursor:pointer;
  transition:border-color .16s,background .16s}
button.act:hover:not(:disabled){border-color:var(--accent)}
button.act:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.act:disabled{opacity:.4;cursor:default}
.tick{font-family:var(--mono);font-size:.74rem;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-left:.3rem}

/* The handoff is the point of the document, so it is a standing block at the
   end of the outline rather than something to scroll for. */
.handoff{margin-top:1.7rem;border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:4px;background:var(--card-2);padding:1.05rem 1.2rem;
  display:flex;gap:1.4rem;align-items:center;flex-wrap:wrap}
.handoff .txt{flex:1 1 24rem;min-width:0}
.handoff .cap{font-family:var(--mono);font-size:.64rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.35rem}
.handoff p{margin:0;font-size:.9rem;color:var(--muted);line-height:1.55}
.handoff .row{display:flex;gap:.4rem;flex-wrap:wrap;flex:0 0 auto}
button.act.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
button.act.primary:hover{border-color:var(--fg);opacity:.88}
button.act.primary.done{background:var(--accent);border-color:var(--accent);color:#fff}

dialog#rawbox{border:1px solid var(--rule);border-radius:5px;padding:1rem 1.15rem;
  background:var(--card);color:var(--fg);width:min(54rem,92vw);max-height:84vh;
  box-shadow:var(--shadow)}
dialog#rawbox::backdrop{background:rgba(22,24,29,.5)}
.rawhead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 0 .5rem}
.rawhead strong{font-family:var(--serif);font-size:1.05rem;font-weight:600}
#rawhelp{font-size:.82rem;color:var(--muted);margin:0 0 .6rem;line-height:1.5}

nt=\"bin/fm-watch.sh\" data-hans=\"bin/fm-watch.sh\">bin/fm-watch.sh<\/text><line x1=\"32\" y1=\"492\" x2=\"928\" y2=\"492\" stroke=\"var(--rule)\" stroke-width=\"0.8\"/><text x=\"32\" y=\"508\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--mono)\" data-en=\"LEGEND\" data-hant=\"圖例\" data-hans=\"图例\">LEGEND<\/text><rect x=\"112\" y=\"498\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--accent-tint)\" stroke=\"var(--accent)\" stroke-width=\"1\"/><text x=\"140\" y=\"508\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"first mate (subject)\" data-hant=\"firstmate（主角）\" data-hans=\"firstmate（主角）\">first mate (subject)<\/text><rect x=\"304\" y=\"498\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--card-2)\" stroke=\"var(--muted)\" stroke-width=\"1\"/><text x=\"332\" y=\"508\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"durable record\" data-hant=\"durable 紀錄\" data-hans=\"durable 纪录\">durable record<\/text><rect x=\"456\" y=\"498\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--card)\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><text x=\"484\" y=\"508\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"outside firstmate\" data-hant=\"firstmate 之外\" data-hans=\"firstmate 之外\">outside firstmate<\/text><rect x=\"628\" y=\"498\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--card)\" stroke=\"var(--seal)\" stroke-width=\"1\"/><text x=\"656\" y=\"508\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"lossy step\" data-hant=\"會丟資料的一步\" data-hans=\"会丢数据的一步\">lossy step<\/text><\/svg>", "edges": [{"from": "captain", "to": "firstmate", "evidence": "AGENTS.md section 1: the captain talks only to the first mate"}, {"from": "firstmate", "to": "crewmate", "evidence": "bin/fm-spawn.sh and bin/fm-send.sh headers"}, {"from": "crewmate", "to": "files", "evidence": "bin/fm-brief.sh scaffold: echo \"{state}: {note}\" >> state/<id>.status"}, {"from": "watcher", "to": "files", "evidence": "bin/fm-watch.sh header: classifies status and turn-end signals, polls the inbox ladder"}, {"from": "watcher", "to": "queue", "evidence": "docs/architecture.md: actionable wakes are written to state/.wake-queue, then the watcher exits"}, {"from": "watcher", "to": "runner", "evidence": "bin/fm-procevent.sh header: reconcile is the idempotent liveness entry the watcher calls on its ordinary cycle"}, {"from": "runner", "to": "queue", "evidence": "bin/fm-watch.sh header: check: process-event result captured"}, {"from": "queue", "to": "firstmate", "evidence": "bin/fm-claude-stop-autoarm.sh: exit 2 delivers the rewake banner; bin/fm-wake-drain.sh presents the rows"}, {"from": "firstmate", "to": "board", "evidence": "bin/fm-bearings-board.sh build: template + payload, then lavish-axi serves it and the session is proved live"}, {"from": "board", "to": "server", "evidence": "lavish-axi <html-file> opens a session on http://127.0.0.1:4387"}, {"from": "captain", "to": "server", "evidence": ".agents/skills/bearings/SKILL.md: the captain answers Captain's Call items directly on the board"}, {"from": "runner", "to": "server", "evidence": "bin/fm-procevent-lavish.sh header: wraps `lavish-axi poll <html-file>`, which long-polls indefinitely and destructively clears feedback"}]}, {"heading": {"en": "Three rules that shape every channel", "hant": "決定每條管道形狀的三條規則", "hans": "决定每条管道形状的三条规则"}, "text": [{"kv": [[{"en": "The record is the delivery", "hant": "紀錄本身就是送達", "hans": "纪录本身就是送达"}, {"en": "fm-send exits 0 when state/<id>.inbox/NNN.msg is written, not when the doorbell lands. The terminal line is free to repeat; the file is processed at most once per worker lifetime because sequence numbers scan handled/ too.", "hant": "fm-send 在 state/<id>.inbox/NNN.msg 寫好時就 exit 0，不等 doorbell 落地。終端那行可以重複敲；檔案每個 worker 一生最多處理一次，因為序號連 handled/ 一起掃。", "hans": "fm-send 在 state/<id>.inbox/NNN.msg 写好时就 exit 0，不等 doorbell 落地。终端那行可以重复敲；文件每个 worker 一生最多处理一次，因为序号连 handled/ 一起扫。"}], [{"en": "A status line is an event, not state", "hant": "status 一行是事件，不是狀態", "hans": "status 一行是事件，不是状态"}, {"en": "state/<id>.status is append-only. The watcher classifies each append; the drain re-surfaces still-open needs-decision or blocked keys as OPEN DECISIONS even when a later working: line buried them. Current state comes from bin/fm-crew-state.sh, never from the last line.", "hant": "state/<id>.status 只能追加。watcher 逐行分類；drain 會把還沒關的 needs-decision 或 blocked key 當成 OPEN DECISIONS 再浮上來，就算後面的 working: 行把它蓋住了。現在的狀態要問 bin/fm-crew-state.sh，永遠不是看最後一行。", "hans": "state/<id>.status 只能追加。watcher 逐行分类；drain 会把还没关的 needs-decision 或 blocked key 当成 OPEN DECISIONS 再浮上来，就算后面的 working: 行把它盖住了。现在的状态要问 bin/fm-crew-state.sh，永远不是看最后一行。"}], [{"en": "Nothing blocks a turn", "hant": "沒有東西會卡回合", "hans": "没有东西会卡回合"}, {"en": "The watcher blocks on the fleet; bin/fm-procevent.sh start blocks on lavish-axi poll; both run outside the model and hand back one queued row. On Claude the Stop hook re-arms the watcher at every turn end and exits 2 to wake the model when the watcher returns with a wake.", "hant": "watcher 阻塞在 fleet 上；bin/fm-procevent.sh start 阻塞在 lavish-axi poll 上；兩者都在模型之外跑，交回來的只有 queue 裡的一列。在 Claude 上，Stop hook 每次回合結束都重新 arm watcher，watcher 帶著 wake 回來時就 exit 2 叫醒模型。", "hans": "watcher 阻塞在 fleet 上；bin/fm-procevent.sh start 阻塞在 lavish-axi poll 上；两者都在模型之外跑，交回来的只有 queue 里的一列。在 Claude 上，Stop hook 每次回合结束都重新 arm watcher，watcher 带着 wake 回来时就 exit 2 叫醒模型。"}]]}, {"p": {"en": "The lifecycle plane is separate on purpose: interrupt, exit and relaunch go through bin/fm-control.sh, because a lifecycle command sent as text becomes chat the worker reasons about instead of executing. fm-send's TYPED plane exists only for text that must reach the harness parser itself, such as a leading slash command.", "hant": "生命週期是刻意分開的一層：interrupt、exit、relaunch 走 bin/fm-control.sh，因為用文字送生命週期指令會變成 worker 拿來推理的聊天內容，而不是被執行。fm-send 的 TYPED 層只給必須碰到 harness 自己 parser 的文字用，例如開頭是斜線的指令。", "hans": "生命周期是刻意分开的一层：interrupt、exit、relaunch 走 bin/fm-control.sh，因为用文字送生命周期指令会变成 worker 拿来推理的聊天内容，而不是被运行。fm-send 的 TYPED 层只给必须碰到 harness 自己 parser 的文字用，例如开头是斜线的指令。"}}]}, {"kind": "figure", "heading": {"en": "Down: steering a crewmate", "hant": "往下：steer 一個 crewmate", "hans": "往下：steer 一个 crewmate"}, "caption": {"en": "bin/fm-send.sh writes the record, rings once, and returns. The worker's mv into handled/ is the only acknowledgement that exists. If it never comes, the watcher re-rings on the 90-second grace up to three times and then wakes the first mate with a stale: (unread firstmate instruction) reason; a dead or missing pane skips the ladder and goes straight to recovery. Frame: the opt region is the watcher's ladder, from bin/fm-task-inbox-lib.sh.", "hant": "bin/fm-send.sh 寫下紀錄、敲一次、返回。worker 把檔案 mv 進 handled/ 是唯一存在的 ack。如果一直沒來，watcher 以 90 秒寬限最多重敲三次，然後用 stale:（firstmate 指令未讀）的理由叫醒 firstmate；pane 已死或不見則跳過階梯直接進復原。框：opt 區是 watcher 的階梯，出自 bin/fm-task-inbox-lib.sh。", "hans": "bin/fm-send.sh 写下纪录、敲一次、返回。worker 把文件 mv 进 handled/ 是唯一存在的 ack。如果一直没来，watcher 以 90 秒宽限最多重敲三次，然后用 stale:（firstmate 指令未读）的理由叫醒 firstmate；pane 已死或不见则跳过阶梯直接进复原。框：opt 区是 watcher 的阶梯，出自 bin/fm-task-inbox-lib.sh。"}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 616\" width=\"100%\" role=\"img\" aria-labelledby=\"fmsteer-title fmsteer-desc\" style=\"font-family:var(--sans)\"><title id=\"fmsteer-title\" data-en=\"Steering a crewmate: the record is the delivery\" data-hant=\"steer 一個 crewmate：紀錄本身就是送達\" data-hans=\"steer 一个 crewmate：纪录本身就是送达\">Steering a crewmate: the record is the delivery<\/title><desc id=\"fmsteer-desc\" data-en=\"Sequence showing fm-send writing a durable inbox record, ringing a constant doorbell, the worker acknowledging by moving the file, and the watcher re-ringing then escalating when no acknowledgement arrives.\" data-hant=\"Sequence：fm-send 寫入 durable inbox 紀錄、敲一行固定的 doorbell、worker 用搬檔案來 ack，沒 ack 時 watcher 重敲再升級。\" data-hans=\"Sequence：fm-send 写入 durable inbox 纪录、敲一行固定的 doorbell、worker 用搬文件来 ack，没 ack 时 watcher 重敲再升级。\">Sequence showing fm-send writing a durable inbox record, ringing a constant doorbell, the worker acknowledging by moving the file, and the watcher re-ringing then escalating when no acknowledgement arrives.<\/desc><defs><marker id=\"fmsteer-arrow\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--muted)\"/><\/marker><marker id=\"fmsteer-arrow-accent\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--accent)\"/><\/marker><marker id=\"fmsteer-arrow-fg\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--fg)\"/><\/marker><marker id=\"fmsteer-arrow-seal\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--seal)\"/><\/marker><marker id=\"fmsteer-arrow-amber\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--amber)\"/><\/marker><marker id=\"fmsteer-arrow-open\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polyline points=\"0 0, 8 3, 0 6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.2\"/><\/marker><\/defs><rect x=\"32\" y=\"40\" width=\"176\" height=\"56\" rx=\"6\" fill=\"var(--card)\"/><rect x=\"32\" y=\"40\" width=\"176\" height=\"56\" rx=\"6\" fill=\"var(--accent-tint)\" stroke=\"var(--accent)\" stroke-width=\"1\" data-node=\"fm\"/><text x=\"120\" y=\"72\" font-size=\"12\" font-weight=\"600\" fill=\"var(--fg)\" text-anchor=\"middle\" style=\"font-family:var(--sans)\" -end) is absorbed only when bin/fm-crew-state.sh proves the crew is still working; anything else becomes a row in state/.wake-queue and the watcher exits. On a Claude primary the Stop hook that foregrounded the watcher then exits 2, which the harness delivers as Stop hook feedback. The row stays durable until the turn runs the printed --ack-through command, so an interrupted turn re-handles it.", "hant": "alt 框就是整個設計：沒有動詞的一行（working:、單純的 turn-end）只有在 bin/fm-crew-state.sh 證明 crew 還在做事時才被吸收；其他一律變成 state/.wake-queue 裡的一列，watcher 退出。在 Claude primary 上，把 watcher 拉到前景的 Stop hook 接著 exit 2，harness 以 Stop hook feedback 送達。那一列一直是 durable 的，直到回合跑了印出來的 --ack-through 指令，所以被中斷的回合會重新處理它。", "hans": "alt 框就是整个设计：没有动词的一行（working:、单纯的 turn-end）只有在 bin/fm-crew-state.sh 证明 crew 还在做事时才被吸收；其他一律变成 state/.wake-queue 里的一列，watcher 退出。在 Claude primary 上，把 watcher 拉到前景的 Stop hook 接着 exit 2，harness 以 Stop hook feedback 送达。那一列一直是 durable 的，直到回合跑了印出来的 --ack-through 指令，所以被中断的回合会重新处理它。"}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 696\" width=\"100%\" role=\"img\" aria-labelledby=\"fmwake-title fmwake-desc\" style=\"font-family:var(--sans)\"><title id=\"fmwake-title\" data-en=\"A crewmate reaches the first mate: one appended line\" data-hant=\"crewmate 找到 firstmate：追加一行\" data-hans=\"crewmate 找到 firstmate：追加一行\">A crewmate reaches the first mate: one appended line<\/title><desc id=\"fmwake-desc\" data-en=\"Sequence showing a worker appending a status line, the watcher classifying it, absorbing a benign wake or queuing an actionable one and exiting, the Claude Stop hook rewaking the first mate, and the drain plus acknowledgement that closes the loop.\" data-hant=\"Sequence：worker 追加一行 status，watcher 分類後吸收或排入 queue 並退出，Claude Stop hook 叫醒 firstmate，drain 加 ack 收尾。\" data-hans=\"Sequence：worker 追加一行 status，watcher 分类后吸收或排入 queue 并退出，Claude Stop hook 叫醒 firstmate，drain 加 ack 收尾。\">Sequence showing a worker appending a status line, the watcher classifying it, absorbing a benign i poll is started by the watcher's reconcile, never by a conversational turn. Only rows tagged choice can become keyed answers; a freeform message is prose and cannot forge a decision key. The one red arrow is the published poll clearing feedback server-side before it returns: a crash between that clear and the runner's capture loses the answer, and no wrapper can close that window.", "hant": "順序就是契約：先提供並證明 session live，把答案來源 bind 到 bin/fm-captain-hold.sh，然後才 arm。阻塞在 lavish-axi poll 上的 runner 由 watcher 的 reconcile 啟動，絕不由對話回合啟動。只有 tag 是 choice 的列能變成 keyed answer；自由輸入的訊息是散文，偽造不了 decision key。唯一的紅箭頭是已發布的 poll 在回傳前先在 server 端清掉 feedback：在那次清除和 runner 捕捉之間當機就會丟掉回答，沒有任何 wrapper 能關上這個窗口。", "hans": "顺序就是契约：先提供并证明 session live，把答案来源 bind 到 bin/fm-captain-hold.sh，然后才 arm。阻塞在 lavish-axi poll 上的 runner 由 watcher 的 reconcile 启动，绝不由对话回合启动。只有 tag 是 choice 的列能变成 keyed answer；自由输入的消息是散文，伪造不了 decision key。唯一的红箭头是已发布的 poll 在回传前先在 server 端清掉 feedback：在那次清除和 runner 捕捉之间当机就会丢掉回答，没有任何 wrapper 能关上这个窗口。"}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 696\" width=\"100%\" role=\"img\" aria-labelledby=\"fmlavish-title fmlavish-desc\" style=\"font-family:var(--sans)\"><title id=\"fmlavish-title\" data-en=\"A Lavish answer travels back without a blocked turn\" data-hant=\"Lavish 的回答回到 firstmate，過程不卡任何回合\" data-hans=\"Lavish 的回答回到 firstmate，过程不卡任何回合\">A Lavish answer travels back without a blocked turn<\/title><desc id=\"fmlavish-desc\" data-en=\"Sequence showing the board served and proved live, the answer source bound before it is armed, a detached runner blocking on lavish-axi poll, the captain answering, the result captured and announced as a wake, choice answers fed to the captain-hold intake, and the first mate reading and acknowledging.\" data-hant=\"Sequence：看板先提供並證明 live、答案來源先 bind 再 arm、runner 在背景阻塞於 lavish-axi poll、captain 作答、結果被捕捉並發出喚醒、選項答案餵給 captain-hold intake、firstmate 讀取並 ack。\" data-hans=\"Sequence：看板先提供并证明 live、答案来源先 bind 再 arm、runner 在背景阻塞于 lavish-axi po ht=\"12\" rx=\"2\" fill=\"var(--card)\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"5,4\"/><text x=\"500\" y=\"664\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"return / async\" data-hant=\"回傳 / 非同步\" data-hans=\"回传 / 异步\">return / async<\/text><\/svg>", "edges": [{"from": "fm", "to": "lavish", "evidence": "bin/fm-bearings-board.sh header"}, {"from": "fm", "to": "hold", "evidence": "bin/fm-bearings-board.sh header: bind ALWAYS precedes arm"}, {"from": "fm", "to": "runner", "evidence": ".agents/skills/process-event-sources/SKILL.md"}, {"from": "runner", "to": "lavish", "evidence": "bin/fm-procevent-lavish.sh header: plain blocking form, no timeout flag"}, {"from": "captain", "to": "lavish", "evidence": ".agents/skills/bearings/SKILL.md Lavish board mode"}, {"from": "lavish", "to": "runner", "evidence": "bin/fm-procevent-lavish.sh header: LOSS LIMITATION"}, {"from": "runner", "to": "runner", "evidence": "bin/fm-procevent-lib.sh: fm_procevent_inbox_dir"}, {"from": "runner", "to": "hold", "evidence": "bin/fm-procevent-lavish.sh header: `answers` reports <task-id>\\t<answer>\\t<label>; bin/fm-captain-hold.sh answers"}, {"from": "runner", "to": "fm", "evidence": "bin/fm-watch.sh header (via state/.wake-queue and the Stop hook rewake)"}, {"from": "fm", "to": "runner", "evidence": ".agents/skills/process-event-sources/SKILL.md Handling a wake"}, {"from": "runner", "to": "runner", "evidence": "bin/fm-procevent-lavish.sh header: AN EMPTY BOARD CLOSE IS NOT NEWS"}]}, {"heading": {"en": "What Lavish is to firstmate", "hant": "Lavish 對 firstmate 是什麼", "hans": "Lavish 对 firstmate 是什么"}, "text": [{"p": {"en": "Lavish is not a peer service; it is one adapter of a generic process-to-event runner. bin/fm-procevent.sh owns ownership, durable capture, publication and restart recovery for any blocking child; bin/fm-procevent-lavish.sh adds only what is Lavish-specific.", "hant": "Lavish 不是對等的服務；它是通用 process-to-event runner 的其中一個 adapter。bin/fm-procevent.sh 負責任何阻塞子程序的擁有權、durable 捕捉、發布和重啟復原；bin/fm-procevent-lavish.sh 只加上 Lavish 專屬的部分。", "hans": "Lavish 不是对等的服务；它是通用 process-to-event runner 的其中一个 adapter。bin/fm-procevent.sh 负责任何阻塞子进程的拥有权、durable 捕捉、发布和重启复原；bin/fm-procevent-lavish.sh 只加上 Lavish 专属的部分。"}}, {"kv": [[{"en": "source id", "hant": "source id", "hans": "source id"}, {"en": "lavish-<first 16 hex of sha256(realpath of the html)>; two paths to one file are one source", "hant": "lavish-<html realpath 的 sha256 前 16 個 hex>；同一個檔案的兩個路徑算一個來源", "hans": "lavish-<html realpath 的 sha256 前 16 个 hex>；同一个文件的两个路径算一个来源"}], [{"en": "classify", "hant": "classify", "hans": "classify"}, {"en": "feedback · ended · waiting · missing · unknown", "hant": "feedback · ended · waiting · missing · unknown", "hans": "feedback · ended · waiting · missing · unknown"}], [{"en": "silent", "hant": "silent", "hans": "silent"}, {"en": "an ended session with no queued content: recorded handled, never announced. Send & End with content is feedback, always announced", "hant": "結束且沒有排隊內容的 session：記為 handled、永不通知。帶內容的 Send & End 是 feedback，一定通知", "hans": "结束且没有排队内容的 session：记为 handled、永不通知。带内容的 Send & End 是 feedback，一定通知"}], [{"en": "terminal", "hant": "terminal", "hans": "terminal"}, {"en": "exit 0 retires the registration, so an ended review needs no cleanup from the model", "hant": "exit 0 就撤銷登記，結束的 review 不需要模型清理", "hans": "exit 0 就撤销登记，结束的 review 不需要模型清理"}], [{"en": "read / answers", "hant": "read / answers", "hans": "read / answers"}, {"en": "read presents every captured item; answers emits <task-id> TAB <answer> TAB <label> for choice rows only and decides nothing", "hant": "read 呈現每個捕捉到的項目；answers 只對 choice 列輸出 <task-id> TAB <answer> TAB <label>，不做任何決定", "hans": "read 呈现每个捕捉到的项目；answers 只对 choice 列输出 <task-id> TAB <answer> TAB <label>，不做任何决定"}], [{"en": "verified against", "hant": "驗證版本", "hans": "验证版本"}, {"en": "lavish-axi 0.1.45: `lavish-axi poll <html-file>` long-polls indefinitely, so the adapter runs the plain blocking form with no timeout", "hant": "lavish-axi 0.1.45：`lavish-axi poll <html-file>` 無限期長輪詢，所以 adapter 跑不帶 timeout 的純阻塞形式", "hans": "lavish-axi 0.1.45：`lavish-axi poll <html-file>` 无限期长轮询，所以 adapter 跑不带 timeout 的纯阻塞形式"}]]}, {"p": {"en": "The /bearings board is the one first-class Lavish surface: bin/fm-bearings-board.sh injects an fm-bearings-board.v1 payload into the shipped template at the stable path (.lavish/bearings-board.html here), proves the session live because lavish-axi exits 0 even on a user-ended session, drops Captain's Call cards whose subject already landed, and gives every decision card the reserved reconcile choice. A Merge now click is the captain's explicit merge word for that one PR, with the PR re-read from state/<task-id>.meta and re-verified green before bin/fm-pr-merge.sh runs.", "hant": "/bearings 看板是唯一的一等 Lavish 介面：bin/fm-bearings-board.sh 把 fm-bearings-board.v1 payload 注入內建 template，放在固定路徑（這裡是 .lavish/bearings-board.html），因為 lavish-axi 就算遇到 user 已結束的 session 也 exit 0 所以要證明 session live，丟掉主題已落地的 Captain's Call 卡片，並給每張決策卡保留的 reconcile 選項。點 Merge now 就是 captain 對那個 PR 的明確合併指令，PR 要從 state/<task-id>.meta 重讀並重新確認 green 才跑 bin/fm-pr-merge.sh。", "hans": "/bearings 看板是唯一的一等 Lavish 界面：bin/fm-bearings-board.sh 把 fm-bearings-board.v1 payload 注入内置 template，放在固定路径（这里是 .lavish/bearings-board.html），因为 lavish-axi 就算遇到 user 已结束的 session 也 exit 0 所以要证明 session live，丢掉主题已落地的 Captain's Call 卡片，并给每张决策卡保留的 reconcile 选项。点 Merge now 就是 captain 对那个 PR 的明确合并指令，PR 要从 state/<task-id>.meta 重读并重新确认 green 才跑 bin/fm-pr-merge.sh。"}}, {"note": {"en": "This home has a live board right now: the session-start hook listed .lavish/bearings-board.html open at http://127.0.0.1:4387/session/a4b444c4e85830a5 with no pending prompts. Whether its poll source is armed was not checked; bin/fm-procevent.sh list would say.", "hant": "這個 home 現在就有一個活著的看板：session-start hook 列出 .lavish/bearings-board.html 在 http://127.0.0.1:4387/session/a4b444c4e85830a5 開著、沒有待處理的 prompt。它的 poll 來源有沒有 arm 沒有檢查；bin/fm-procevent.sh list 會告訴你。", "hans": "这个 home 现在就有一个活着的看板：session-start hook 列出 .lavish/bearings-board.html 在 http://127.0.0.1:4387/session/a4b444c4e85830a5 开着、没有待处理的 prompt。它的 poll 来源有没有 arm 没有检查；bin/fm-procevent.sh list 会告诉你。"}}]}, {"kind": "figure", "heading": {"en": "Subagent: the tool that is refused, and what replaces it", "hant": "subagent：被拒絕的工具，和取代它的東西", "hans": "subagent：被拒绝的工具，和取代它的东西"}, "caption": {"en": "Left is what happened in this session when the model reached for the Agent tool: bin/fm-subagent-pretool-check.sh denied it by name shape. The reason is an incident on 2026-07-22 - four workers run through the harness tool, zero fleet visibility, two lost on restart, supervision down 73 minutes unnoticed - and the structural cause: only bin/fm-spawn.sh writes state/<id>.meta, so untracked work makes the in-flight guards inert. Right is the path that leaves a record the watcher can see. FM_ALLOW_SUBAGENT=1 is the documented deliberate exception.", "hant": "左邊是這個 session 裡模型伸手拿 Agent 工具時發生的事：bin/fm-subagent-pretool-check.sh 依名稱形狀擋下。原因是 2026-07-22 的事故：四個 worker 走 harness 工具跑、fleet 完全看不見、重啟丟了兩個、supervision 停了 73 分鐘沒人發現；結構性原因是只有 bin/fm-spawn.sh 會寫 state/<id>.meta，沒登記的工作讓 in-flight guard 全部失效。右邊是會留下 watcher 看得到的紀錄的那條路。FM_ALLOW_SUBAGENT=1 是文件明寫的刻意例外。", "hans": "左边是这个 session 里模型伸手拿 Agent 工具时发生的事：bin/fm-subagent-pretool-check.sh 依名称形状挡下。原因是 2026-07-22 的事故：四个 worker 走 harness 工具跑、fleet 完全看不见、重启丢了两个、supervision 停了 73 分钟没人发现；结构性原因是只有 bin/fm-spawn.sh 会写 state/<id>.meta，没登记的工作让 in-flight guard 全部失效。右边是会留下 watcher 看得到的纪录的那条路。FM_ALLOW_SUBAGENT=1 是文档明写的刻意例外。"}, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" width=\"100%\" role=\"img\" aria-labelledby=\"fmguard-title fmguard-desc\" style=\"font-family:var(--sans)\"><title id=\"fmguard-title\" data-en=\"Harness subagent vs crewmate\" data-hant=\"harness 的 subagent vs crewmate\" data-hans=\"harness 的 subagent vs crewmate\">Harness subagent vs crewmate<\/title><desc id=\"fmguard-desc\" data-en=\"Two panels: the harness's own Agent tool is denied by a PreToolUse guard because such work leaves no fleet record and dies with the session; a crewmate goes through fm-brief and fm-spawn and gets a worktree, a pane, metadata, and a status log the watcher can see.\" data-hant=\"兩個面板：harness 自帶的 Agent 工具被 PreToolUse guard 擋下，因為那種工作沒有 fleet 紀錄、session 一死就沒了；crewmate 走 fm-brief 和 fm-spawn，拿到 worktree、pane、metadata 和 watcher 看得到的 status log。\" data-hans=\"两个面板：harness 自带的 Agent 工具被 PreToolUse guard 挡下，因为那种工作没有 fleet 纪录、session 一死就没了；crewmate 走 fm-brief 和 fm-spawn，拿到 worktree、pane、metadata 和 watcher 看得到的 status log。\">Two panels: the harness's own Agent tool is denied by a PreToolUse guard because such work leaves no fleet record and dies with the session; a crewmate goes through fm-brief and fm-spawn and gets a worktree, a pane, metadata, and a status log the watcher can see.<\/desc><defs><marker id=\"fmguard-arrow\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--muted)\"/><\/marker><marker id=\"fmguard-arrow-accent\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--accent)\"/><\/marker><marker id=\"fmguard-arrow-fg\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--fg)\"/><\/marker><marker id=\"fmguard-arrow-seal\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--seal)\"/><\/marker><marker id=\"fmguard-arrow-amber\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0, 8 3, 0 6\" fill=\"var(--amber)\"/><\/marker><marker id=\"fmguard-arrow-open\" markerWidth=\"8\" markerHeight=\"6\" refX=\"7\" refY=\"3\" orient=\"auto\"><polyline points=\"0 0, 8 3, 0 6\" fill=\"none\" stroke=\"var(--muted)\" o)\" data-en=\"brief.md scaffold\" data-hant=\"brief.md 骨架\" data-hans=\"brief.md 骨架\">brief.md scaffold<\/text><rect x=\"558\" y=\"232\" width=\"160\" height=\"48\" rx=\"6\" fill=\"var(--card)\"/><rect x=\"558\" y=\"232\" width=\"160\" height=\"48\" rx=\"6\" fill=\"var(--card)\" stroke=\"var(--fg)\" stroke-width=\"1\" data-node=\"spawn\"/><text x=\"638\" y=\"252\" font-size=\"12\" font-weight=\"600\" fill=\"var(--fg)\" text-anchor=\"middle\" style=\"font-family:var(--sans)\" data-en=\"bin/fm-spawn.sh\" data-hant=\"bin/fm-spawn.sh\" data-hans=\"bin/fm-spawn.sh\">bin/fm-spawn.sh<\/text><text x=\"638\" y=\"272\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"middle\" style=\"font-family:var(--mono)\" data-en=\"meta · backlog · pane\" data-hant=\"meta · backlog · pane\" data-hans=\"meta · backlog · pane\">meta · backlog · pane<\/text><rect x=\"750\" y=\"216\" width=\"160\" height=\"80\" rx=\"6\" fill=\"var(--card)\"/><rect x=\"750\" y=\"216\" width=\"160\" height=\"80\" rx=\"6\" fill=\"var(--card-2)\" stroke=\"var(--muted)\" stroke-width=\"1\" data-node=\"crew\"/><text x=\"830\" y=\"252\" font-size=\"12\" font-weight=\"600\" fill=\"var(--fg)\" text-anchor=\"middle\" style=\"font-family:var(--sans)\" data-en=\"Crewmate\" data-hant=\"crewmate\" data-hans=\"crewmate\">Crewmate<\/text><text x=\"830\" y=\"272\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"middle\" style=\"font-family:var(--mono)\" data-en=\"worktree · status log\" data-hant=\"worktree · status log\" data-hans=\"worktree · status log\">worktree · status log<\/text><line x1=\"32\" y1=\"352\" x2=\"928\" y2=\"352\" stroke=\"var(--rule)\" stroke-width=\"0.8\"/><text x=\"32\" y=\"368\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--mono)\" data-en=\"LEGEND\" data-hant=\"圖例\" data-hans=\"图例\">LEGEND<\/text><rect x=\"112\" y=\"358\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--accent-tint)\" stroke=\"var(--accent)\" stroke-width=\"1\"/><text x=\"140\" y=\"368\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"primary session\" data-hant=\"primary session\" data-hans=\"primary session\">primary session<\/text><rect x=\"268\" y=\"358\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--card)\" stroke=\"var(--seal)\" stroke-width=\"1\"/><text x=\"296\" y=\"368\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"refused\" data-hant=\"被拒絕\" data-hans=\"被拒绝\">refused<\/text><rect x=\"368\" y=\"358\" width=\"20\" height=\"12\" rx=\"2\" fill=\"var(--card-2)\" stroke=\"var(--muted)\" stroke-width=\"1\"/><text x=\"396\" y=\"368\" font-size=\"12\" font-weight=\"400\" fill=\"var(--muted)\" text-anchor=\"start\" style=\"font-family:var(--sans)\" data-en=\"durable fleet record\" data-hant=\"durable fleet 紀錄\" data-hans=\"durable fleet 纪录\">durable fleet record<\/text><\/svg>", "edges": [{"from": "primary-l", "to": "agent-tool", "evidence": "this session: Agent(claude-code-guide) was attempted"}, {"from": "agent-tool", "to": "guard", "evidence": "observed this session: permissionDecision deny, '[subagent-dispatch] the firstmate primary dispatches through the fleet'"}, {"from": "primary-r", "to": "brief", "evidence": "AGENTS.md section 7: write the brief before spawning"}, {"from": "brief", "to": "spawn", "evidence": "bin/fm-spawn.sh header: reads the brief's Delivery contract line and refuses a mismatch"}, {"from": "spawn", "to": "crew", "evidence": "bin/fm-spawn.sh header: isolated worktree, state/<id>.meta, backlog transition to In flight"}]}, {"kind": "points", "heading": {"en": "What to watch", "hant": "要注意的事", "hans": "要注意的事"}, "items": [{"tone": "risk", "tag": "lossy window", "text": {"en": "`lavish-axi poll` clears feedback before returning it. Output that reached the runner is stored before it is announced, but a result ### Workstream 2: this packet (the firstmate architecture reading)

Routing: the input is an existing, implemented system (done work) and the reader is the captain, an engineer → `engineer` register, `eli5` skipped. The captain's question has two halves: (1) how firstmate talks to crewmates ("subagent" in the captain's words), and (2) how it talks to Lavish.

What I read, in order: baton's `references/pipeline.md`, `spec.md`, `diagrams.md` (embedding contract), then firstmate: `docs/` listing, grep for Lavish touchpoints, `docs/architecture.md` (headings, "Event-driven supervision", busy state, backends, worktrees, task shapes), headers of `bin/fm-send.sh`, `bin/fm-spawn.sh`, `bin/fm-procevent.sh`, `bin/fm-procevent-lavish.sh`, `bin/fm-task-inbox-lib.sh`, `bin/fm-watch.sh`, `bin/fm-brief.sh` (status + inbox sections), `bin/fm-classify-lib.sh`, `bin/fm-wake-drain.sh`, `bin/fm-bearings-board.sh`, `bin/fm-captain-hold.sh`, `bin/fm-claude-stop-autoarm.sh` (exit-2 lines), `docs/subagent-guard.md`, the `process-event-sources` and `bearings` skills, README overview. Then the `diagram-design` skill and its sequence/architecture references.

The model I arrived at — three channels, all file-mediated, none blocking a turn:

1. **Down (firstmate → crewmate):** `fm-brief.sh` writes the brief; `fm-spawn.sh` creates the worktree + pane + `state/<id>.meta` and moves the backlog item; `fm-send.sh` steers by writing `state/<id>.inbox/NNN.msg` and typing one constant doorbell line; the worker's `mv … handled/` is the ack; the watcher re-rings (90 s grace × 3) and then escalates a `stale: (unread firstmate instruction)` wake. Lifecycle (interrupt/exit/relaunch) goes through `fm-control.sh`, never through the text plane.
2. **Up (crewmate → firstmate):** the worker appends `<state>: <note>` to `state/<id>.status` (and turn-end hooks touch `<id>.turn-ended`); `fm-watch.sh` classifies; benign no-verb wakes are absorbed only with positive proof the crew is working (`fm-crew-state.sh`); actionable wakes become a row in `state/.wake-queue` and the watcher exits; on Claude, the Stop hook's foreground arm returns, the hook exits 2, the "Stop hook feedback" wakes the model; the turn runs `fm-wake-drain.sh`, handles, and acks with `--ack-through <generation>`; the next turn end re-arms. A status line is an event, never current state.
3. **Sideways (Lavish ↔ firstmate):** an artifact is served by `lavish-axi <file>`; firstmate never runs `lavish-axi poll` in a turn; `fm-procevent-lavish.sh arm` registers a source (id = hash of the realpath); the watcher's `reconcile` starts a detached runner that blocks on the poll; the returned result is captured to `state/procevent-inbox/<id>.<seq>.result`, `choice`-tagged rows are fed to `fm-captain-hold.sh`'s keyed intake (bound *before* arming), and a `check: process-event result captured` wake goes through the same queue/rewake path; firstmate then `classify`/`read`/`handled`. An ended session with nothing said is `silent` (never announced); a `Send & End` with content is `feedback`. The board-specific layer (`fm-bearings-board.sh`) adds: prove the session live before bind/arm, decision keys = task ids, `merge.<task-id>` and `dispatch.charted` routed by the agent.
4. **"Subagent" as the captain may mean it:** the harness's own Agent/Task tool is denied by `fm-subagent-pretool-check.sh` (observed this session) because such work leaves no fleet record and dies with the session; `FM_ALLOW_SUBAGENT=1` is the documented deliberate exception. Crewmates are the replacement.

Decisions taken for the page: five figures — architecture map, steer sequence, status→wake sequence, Lavish sequence, guard comparison — all drawn from headers and prose (no design-doc diagram exists) and labelled as such; one shared Python layout library (`draw.py`) so the set is one visual system; colours by meaning (accent = firstmate / the durable step, seal = the lossy poll window, amber = escalation, dashed muted = outside firstmate); every text node carries en/hant/hans with hans derived by OpenCC `tw2sp`; register `engineer`.

Things I did **not** verify and say so on the page: I did not run `fm-send`, `fm-spawn`, or `fm-procevent` (this home has no crew, and `no-mistakes`/`gh-axi` are MISSING so dispatch is blocked anyway); I did not open the live bearings board or the lavish-axi session; I did not read `docs/pi-supervision-branch.md`, `docs/herdr-backend.md` (native blocked-event wait), `docs/remote-secondmates.md`, or the Relay docs — those paths are named as not drawn. The exact `.wake-queue` row consumption and per-actor claims (`docs/watcher-continuity.md`) were not read.

      if(b.kv){
        h+='<dl class="kv">'+b.kv.map(r=>
          '<dt>'+E(pick(r[0],lang))+'</dt><dd>'+rich(pick(r[1],lang))+'</dd>').join('')+'</dl>';
        return;
      }
      if(b.p!=null) h+='<p'+(b.lead?' class="lead"':'')+'>'+rich(pick(b.p,lang))+'</p>';
    });
    return h;
  }

  // Escape first, then honour exactly three marks: [label](https://url),
  // `code`, **lead-in**. The link URL must be absolute http(s) — anything
  // else stays literal text, so a packet cannot smuggle javascript: or markup.
  function rich(v){
    return String(v)
      .replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  }

  function paint(){
    const t=T[lang];
    document.documentElement.lang = lang==='en'?'en':(lang==='hant'?'zh-Hant':'zh-Hans');
    document.getElementById('eyebrow').textContent =
      [D.repo,D.branch,D.range].filter(Boolean).join('  ·  ');
    document.getElementById('title').textContent = pick(D.title,lang);
    document.getElementById('sub').textContent = pick(D.subtitle,lang);
    const lgHTML = ['subj','att','term','ctx'].map((c,i)=>
      '<span><i class="swatch '+c+'"></i>'+t.lg[i]+'</span>').join('');
    document.querySelectorAll('.legend').forEach(el=>{el.innerHTML=lgHTML;});
    document.getElementById('outline-h').textContent=t.outline;
    document.getElementById('ho-cap').textContent=t.hocap;
    document.getElementById('ho-help').textContent=t.hohelp;
    document.getElementById('cp').textContent=t.cp;
    document.getElementById('raw').textContent=t.raw;
    document.getElementById('dl').textContent=t.dl;
    document.getElementById('rawtitle').textContent=t.rawtitle;
    document.getElementById('rawhelp').textContent=t.rawhelp;
    document.getElementById('prev').textContent=t.prev;
    document.getElementById('next').textContent=t.next;
    document.getElementById('tick').textContent=t.of(idx+1,secs.length);

    built.forEach((el,i)=>{
      const s=secs[i];
      const box=el.querySelector('.txnbox');
      if(box) box.innerHTML=txnHTML(s,lang);
      const vbox=el.querySelector('.vulnbox');
      if(vbox){ vbox.innerHTML=vulnHTML(s,lang);
        vbox.querySelectorAll('svg text[data-en]').forEach(n=>{
          n.textContent=n.hasAttribute('data-'+lang)?n.getAttribute('data-'+lang):n.getAttribute('data-en');});}
      const h=el.querySelector('[data-i=heading]'); if(h) h.textContent=pick(s.heading,lang);
      const tx=el.querySelector('[data-i=text]');
      if(tx) tx.innerHTML = rich(pick(s.text,lang));
      const pr=el.querySelector('[data-i=prose]');
      if(pr) pr.innerHTML = proseHTML(s.text,lang);
      const cp=el.querySelector('[data-i=caption]'); if(cp) cp.textContent=pick(s.caption,lang);
      const hn=el.querySelector('[data-i=hint]');
      if(hn) hn.textContent = s.hint ? pick(s.hint,lang) : (T[lang].smapHint||'');
      el.querySelectorAll('[data-item]').forEach(sp=>{
        // `text` may carry <code> around names worth keeping verbatim; nothing
        // else is honoured, so a packet cannot smuggle markup into the page.
        sp.innerHTML = rich(pick((s.items||[])[+sp.dataset.item]?.text,lang));
      });
    });
    // One SVG carries all three languages, so switching cannot shift layout.
    document.querySelectorAll('svg text[data-en]').forEach(n=>{
      n.textContent = n.hasAttribute('data-'+lang)
        ? n.getAttribute('data-'+lang) : n.getAttribute('data-en');
    });

    const ol=document.getElementById('outline'); ol.innerHTML='';
    secs.forEach((s,i)=>{
      const li=document.createElement('li');
      const b=document.createElement('button'); b.type='button';
      const t2=document.createElement('span'); t2.className='ttl';
      t2.textContent=pick(s.heading,lang); b.appendChild(t2);
      b.setAttribute('aria-current',String(i===idx));
      b.addEventListener('click',()=>go(i));
      li.appendChild(b); ol.appendChild(li);
    });
    // The ticks are the only navigation on screen when the drawer is closed,
    // so they carry position and length without needing the titles.
    const rt=document.getElementById('railticks'); rt.innerHTML='';
    secs.forEach((s,i)=>{
      const b=document.createElement('button'); b.type='button';
      b.textContent=String(i+1).padStart(2,'0');
      b.title=pick(s.heading,lang);
      b.setAttribute('aria-current',String(i===idx));
      b.addEventListener('click',()=>go(i));
      rt.appendChild(b);
    });
    document.querySelectorAll('.langs button').forEach(b=>
      b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
    document.getElementById('prev').disabled=idx===0;
    document.getElementById('next').disabled=idx===secs.length-1;
    document.getElementById('foot').innerHTML =
      'baton · format '+D.format_version+' · <span class="layer">'+D.layer+'</span>'+
      (D.layer_note?' · '+String(pick(D.layer_note,lang)).replace(/`/g,''):'');
  }

  function go(n){
    if(n<0||n>=secs.length) return;
    built[idx].classList.remove('on');
    idx=n;
    built[idx].classList.add('on');
    animate(built[idx]);
    paint();
  }

  // The drawer opens on approach and closes on a short delay, so clipping a
  // corner on the way to a tick does not snap it shut mid-reach. CSS :hover
  // does the same thing on its own; this only makes the close forgiving.
  (function(){
    const rail=document.querySelector('.rail'); if(!rail) return;
    let t=null;
    const set=v=>{clearTimeout(t);
      if(v) rail.classList.add('open');
      else t=setTimeout(()=>rail.classList.remove('open'),260);};
    rail.addEventListener('pointerenter',()=>set(true));
    rail.addEventListener('pointerleave',()=>set(false));
    rail.addEventListener('focusin',()=>set(true));
    rail.addEventListener('focusout',()=>set(false));
  })();

  document.querySelectorAll('.langs button').forEach(b=>
    b.addEventListener('click',()=>{lang=b.dataset.lang;
      localStorage.setItem('baton-lang',lang); paint();}));
  document.getElementById('prev').addEventListener('click',()=>go(idx-1));
  document.getElementById('next').addEventListener('click',()=>go(idx+1));
  addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowRight'||e.key==='j') go(idx+1);
    if(e.key==='ArrowLeft'||e.key==='k') go(idx-1);
  });

  // The one action the page exists to enable, so it has to work everywhere the
  // page can be opened. A published page runs inside an iframe where the async
  // clipboard is often denied, and a button that silently does nothing strands
  // the reader with no way to reach the packet at all. Three rungs: the async
  // API, the legacy command, then a panel with the text already selected,
  // which needs no permission anywhere.
  const rawbox=document.getElementById('rawbox'), rawtext=document.getElementById('rawtext');
  function showRaw(){
    rawtext.value=CTX;
    if(typeof rawbox.showModal==='function') rawbox.showModal();
    else rawbox.setAttribute('open','');
    rawtext.focus(); rawtext.select();
  }
  const cp=document.getElementById('cp');
  cp.addEventListener('click',async()=>{
    let ok=false;
    try{ await navigator.clipboard.writeText(CTX); ok=true; }
    catch(e){
      try{
        const ta=document.createElement('textarea');
        ta.value=CTX; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        ok=document.execCommand('copy'); ta.remove();
      }catch(e2){ ok=false; }
    }
    if(!ok){ showRaw(); return; }
    cp.classList.add('done'); cp.textContent=T[lang].copied;
    setTimeout(()=>{cp.classList.remove('done'); cp.textContent=T[lang].cp;},2000);
  });
  document.getElementById('raw').addEventListener('click',showRaw);
  document.getElementById('dl').addEventListener('click',()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([CTX],{type:'text/markdown'}));
    a.download=D.filename+'.md'; a.click(); URL.revokeObjectURL(a.href);
  });

  // ---- diagrams are inline SVG from the diagram-design skill: static markup,
  // no runtime library. Two things stay live — the labels follow the reader's
  // language, and the colours follow the theme through CSS variables, which
  // need no work here at all.
  function relabelDiagrams(){
    document.querySelectorAll('.figbody svg text[data-en]').forEach(n=>{
      n.textContent = n.hasAttribute('data-'+lang)
        ? n.getAttribute('data-'+lang) : n.getAttribute('data-en');
    });
    markInert();
    autoPickStatemaps();   // restore the selected state after a relabel
  }

  // Interactive state map: clicking a state shows the DB write behind it.
  // Show that state's DB transaction and light up its rollout stage.
  function selectState(secIdx, id){
    const s = secs[secIdx];
    if(!s || !s.detail) return;
    const step = built[secIdx];
    const detail = step.querySelector('.smap-detail');
    const txn = s.detail[id];
    if(detail){
      if(txn){ detail.innerHTML = txnHTML(txn, lang); }
      else { detail.innerHTML=''; detail.setAttribute('data-empty', T[lang].smapEmpty||'Pick a state to see its database write.'); }
    }
    const stage = (s.stages||{})[id];
    step.querySelectorAll('.smap-stage').forEach(d=>
      d.classList.toggle('on', !!stage && d.dataset.stage===stage));
    // Highlight by the contract attribute — the shape carries its own id.
    step.querySelectorAll('.figbody svg [data-node]').forEach(n=>{
      n.classList.toggle('picked', n.getAttribute('data-node')===id);
      n.style.strokeWidth = n.getAttribute('data-node')===id ? '3' : '';
    });
    step.dataset.picked=id;
  }

  // A shape with no transaction behind it should not look clickable, and a
  // stage no state belongs to is not a control. Mark both once the diagram is
  // in the DOM, so the page never invites a click it cannot answer.
  function markInert(){
    secs.forEach((s,i)=>{
      if(s.kind!=='statemap') return;
      const step=built[i], detail=s.detail||{}, stages=s.stages||{};
      step.querySelectorAll('.figbody svg [data-node]').forEach(n=>
        n.classList.toggle('inert', !detail[n.getAttribute('data-node')]));
      const live=new Set(Object.keys(detail).map(k=>stages[k]).filter(Boolean));
      step.querySelectorAll('.smap-stage').forEach(d=>{
        const empty=!live.has(d.dataset.stage);
        d.classList.toggle('empty', empty);
        d.disabled=empty;
      });
    });
  }
  // The diagram is static SVG with no script of its own, so the page owns the
  // interaction: delegate a click, read the id off the shape. This is why the
  // statemap still works inlined in a sandboxed iframe.
  document.addEventListener('click', e=>{
    const step = e.target.closest && e.target.closest('.step.smap');
    if(!step) return;
    const panel = step.querySelector('.smap-detail');
    if(!panel) return;
    const sec = +panel.dataset.sec, s = secs[sec];

    const hit = e.target.closest('[data-node]');
    if(hit && (s.detail||{})[hit.getAttribute('data-node')]){
      selectState(sec, hit.getAttribute('data-node')); return;
    }
    // The stage strip is a second way in: pick the state that lives there.
    const chip = e.target.closest('.smap-stage');
    if(chip && !chip.disabled){
      const id = Object.keys(s.detail||{})
        .find(k => (s.stages||{})[k] === chip.dataset.stage);
      if(id) selectState(sec, id);
    }
  });
  function autoPickStatemaps(){
    secs.forEach((s,i)=>{ if(s.kind==='statemap' && s.detail){
      const cur=built[i].dataset.picked;
      const first=cur||Object.keys(s.detail)[0];
      if(first) selectState(i, first);
    }});
  }

  // Re-render on language and on theme change (the theme toggle stamps data-theme).
  const _paint = paint;
  paint = function(){ _paint(); relabelDiagrams(); };

  built[0].classList.add('on'); animate(built[0]); paint();
})();
</script>
</body>
</html>
